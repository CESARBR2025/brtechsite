<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151127" />
    <title>Sin conexión · BR TECH</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(60% 45% at 50% 30%, rgba(120, 54, 226, 0.28), transparent 70%), #151127;
        color: #fff; text-align: center;
      }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { margin: 28px 0 8px; font-size: 24px; letter-spacing: -0.02em; }
      p { margin: 0 auto; max-width: 300px; font-size: 15px; line-height: 1.55; color: rgba(255, 255, 255, 0.65); }
      button {
        margin-top: 28px; border: 0; border-radius: 999px; padding: 14px 28px; font: inherit; font-weight: 600;
        color: #fff; background: linear-gradient(90deg, #7836e2, #471fa3);
        box-shadow: 0 10px 30px -8px rgba(120, 54, 226, 0.6);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icono-192.png" alt="BR TECH" />
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. Lo que ya se guardó está a salvo. Vuelve a intentarlo cuando tengas señal.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
